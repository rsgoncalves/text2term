[project]
name = "text2term"
version = "4.6.0"
description = "A tool for mapping free-text descriptions of entities to ontology terms"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["ontology", "metadata", "text mining", "metadata curation", "ontology mapping"]

authors = [
    { name="Rafael Goncalves", email="rsgoncalves@gmx.com" },
    { name="Jason Payne", email="paynejason@gmail.com" }
]
maintainers = [
    { name="Rafael Goncalves", email="rsgoncalves@gmx.com" }
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
]

dependencies = [
    "bioregistry>=0.11.10",
    "nltk>=3.9.1",
    "owlready2>=0.47",
    "pandas>=2.2.3",
    "rapidfuzz>=3.12.2",
    "requests>=2.32.3",
    "scikit-learn>=1.6.1",
    "shortuuid>=1.0.11",
    "sparse-dot-topn>=1.1.3",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.1.1"]

[tool.setuptools]
packages = ["text2term"]
include-package-data = true

[tool.coverage.run]
omit = ["*/__main__.py"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project.urls]
Homepage = "https://github.com/rsgoncalves/text2term"
Repository = "https://github.com/rsgoncalves/text2term.git"
Issues = "https://github.com/rsgoncalves/text2term/issues"
